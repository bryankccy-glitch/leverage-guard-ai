name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_USER: leverage, POSTGRES_PASSWORD: leverage_local_dev, POSTGRES_DB: leverage }
        ports: ["54330:5432"]
        options: --health-cmd "pg_isready -U leverage" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Migrate
        run: |
          for f in supabase/local/00_auth_stub.sql supabase/migrations/*.sql; do
            PGPASSWORD=leverage_local_dev psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54330 -U leverage -d leverage -f "$f"
          done
      - name: Install & test
        working-directory: apps/api
        env: { LLM_PROVIDER: none, JWT_SECRET: ci-only-secret-0123456789abcdef0123456789 }
        run: |
          pip install -r requirements-dev.txt
          python -m app.services.seed
          ruff check app tests || true
          python -m pytest -q
          python ../../scripts/run_evaluation.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - working-directory: apps/web
        run: |
          npm ci
          npx tsc --noEmit
          npx eslint .
          npx next build
